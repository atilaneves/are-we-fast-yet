# -*- mode: yaml -*-
# Compare the snakebite bytecode VM with other VMs on AWFY.
default_experiment: native
default_data_file: 'compare.data'

.iterations:
    short: &SHORT 20

runs:
    invocations: 3

benchmark_suites:
    native:
        gauge_adapter: RebenchLog
        command: " %(benchmark)s %(variable)s "
        variable_values: [*SHORT]
        max_invocation_time: 600
        benchmarks: &BENCHMARKS
            - DeltaBlue:
                extra_args: 12000
            - Richards:
                extra_args: 100
            - Json:
                extra_args: 100
            - CD:
                extra_args: 250
            - Havlak:
                extra_args: 1500
            - Bounce:
                extra_args: 1500
            - List:
                extra_args: 1500
            - Mandelbrot:
                extra_args: 500
            - NBody:
                extra_args: 250000
            - Permute:
                extra_args: 1000
            - Queens:
                extra_args: 1000
            - Sieve:
                extra_args: 3000
            - Storage:
                extra_args: 1000
            - Towers:
                extra_args: 600

executors:
    C++:
        path: benchmarks/C++
        executable: harness
    D-checks:
        path: benchmarks/D
        executable: harness
    D-release:
        path: benchmarks/D
        executable: harness-release
    D-manual:
        path: benchmarks/D
        executable: harness-manual-release

experiments:
    native:
        description: Native C++ against native D, to check the D port
        suites: [native]
        executions: [C++, D-release, D-manual]
