# -*- mode: yaml -*-
# Compare VMs on AWFY. Run it through driver/compare.sh. See driver/README.md.
# Two suites over the same executors and benchmark arguments:
#   wall:       /usr/bin/time around one invocation that runs 1 outer iteration
#   iterations: the harness's own times for 20 outer iterations
default_experiment: all
default_data_file: 'compare.data'

runs:
    invocations: 3
    min_iteration_time: 0

benchmark_suites:
    wall:
        gauge_adapter: Time
        iterations: 1
        command: " %(benchmark)s %(iterations)s "
        max_invocation_time: 3600
        benchmarks: &BENCHMARKS
            - DeltaBlue:
                extra_args: 12000
            - Richards:
                extra_args: 100
            - Json:
                extra_args: 100
            - CD:
                extra_args: 250
            - Havlak:
                extra_args: 1500
            - Bounce:
                extra_args: 1500
            - List:
                extra_args: 1500
            - Mandelbrot:
                extra_args: 500
            - NBody:
                extra_args: 250000
            - Permute:
                extra_args: 1000
            - Queens:
                extra_args: 1000
            - Sieve:
                extra_args: 3000
            - Storage:
                extra_args: 1000
            - Towers:
                extra_args: 600
    iterations:
        gauge_adapter: RebenchLog
        iterations: 20
        command: " %(benchmark)s %(iterations)s "
        max_invocation_time: 3600
        benchmarks: *BENCHMARKS

# Every executor runs through driver/run: DIRECTORY COMMAND ARGS.
# driver/compare.sh sets PATH. bin/sb keeps one dependency image per start
# directory and project, and the image depends on --version. sb-manual starts
# in its own directory so that it does not replace the image of sb-gc.
executors:
    C++:
        executable: driver/run
        args: "benchmarks/C++ ./harness"
    D-gc:
        executable: driver/run
        args: "benchmarks/D ./harness"
    D-gc-sbopts:
        executable: driver/run
        args: "benchmarks/D ./harness --DRT-gcopt='cleanup:none heapSizeFactor:4'"
    D-manual:
        executable: driver/run
        args: "benchmarks/D ./harness-manual"
    D-symgc:
        executable: driver/run
        args: "benchmarks/D ./harness-symgc --DRT-gcopt=gc:sdcq"
    sb-gc:
        executable: driver/run
        args: "benchmarks/D sb -I src src -- --DRT-testmode=run-main"
    sb-manual:
        executable: driver/run
        args: "results/sb-manual sb --version=ManualMemory -I ../../benchmarks/D/src ../../benchmarks/D/src -- --DRT-testmode=run-main"
    sb-symgc:
        executable: driver/run
        args: "benchmarks/D env DGC=symgc sb -I src src -- --DRT-testmode=run-main"
    java-Xint:
        executable: driver/run
        args: "benchmarks/Java java -Xint -cp benchmarks.jar Harness"
    java:
        executable: driver/run
        args: "benchmarks/Java java -cp benchmarks.jar Harness"
    node-jitless:
        executable: driver/run
        args: "benchmarks/JavaScript node --jitless harness.js"
    node:
        executable: driver/run
        args: "benchmarks/JavaScript node harness.js"
    lua:
        executable: driver/run
        args: "benchmarks/Lua lua harness.lua"
    luajit-joff:
        executable: driver/run
        args: "benchmarks/Lua luajit -joff harness.lua"
    luajit:
        executable: driver/run
        args: "benchmarks/Lua luajit harness.lua"
    python3:
        executable: driver/run
        args: "benchmarks/Python python3 harness.py"
    wasm3:
        executable: driver/run
        args: "benchmarks/C++ wasm3 harness.wasm"

experiments:
    wall:
        description: Whole-process wall time, 1 outer iteration
        suites: [wall]
        executions: [C++, D-gc, D-gc-sbopts, D-manual, D-symgc, sb-gc, sb-manual, sb-symgc, java-Xint, java, node-jitless, node, lua, luajit-joff, luajit, python3, wasm3]
    iterations:
        description: Harness iteration times, 20 outer iterations
        suites: [iterations]
        executions: [C++, D-gc, D-gc-sbopts, D-manual, D-symgc, sb-gc, sb-manual, sb-symgc, java-Xint, java, node-jitless, node, lua, luajit-joff, luajit, python3, wasm3]
